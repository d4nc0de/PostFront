<div class="card">
    <p-dataview #dv [value]="posts()" [layout]="layout">
        <ng-template #grid let-items>
            <div class="grid grid-cols-12 gap-4">
                <div *ngFor="let post of items" class="post col-span-12 sm:col-span-6 md:col-span-4 xl:col-span-6 p-2">
                    <div
                        class="p-6 border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 rounded flex flex-col"
                    >

                        <div class="pt-6">
                            <div class="flex flex-row justify-between products-start gap-2">
                                <div>
                                    <div class="text-lg font-medium mt-1">{{ post.contenido }}</div>
                                </div>
                            </div>
                            <div class="flex flex-col gap-6 mt-6">
                                <div class="flex gap-2">
                                    <a href="/posts/{{ post.idp }}" class="flex-auto whitespace-nowrap" icon="pi pi-comments" pButton target="_blank" rel="noopener noreferrer">
                                        <span pButtonLabel>Comentarios</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </ng-template>
    </p-dataview>
</div>
